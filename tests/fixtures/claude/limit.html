<!doctype html>
<!-- Reduced snapshot of a Claude page with a usage limit. It holds no personal data. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude</title>
  </head>
  <body>
    <main>
      <div data-testid="hub-composer-notices" role="status">
        You've reached your message limit. Try again at 5 PM.
      </div>
      <form action="/answer" method="get">
        <div
          contenteditable="true"
          role="textbox"
          data-testid="chat-input"
          aria-label="Write your prompt to Claude"
        ></div>
        <button type="submit" data-testid="chat-input-send" aria-label="Send message">Send</button>
      </form>
    </main>
  </body>
</html>
